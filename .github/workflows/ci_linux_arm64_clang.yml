name: CI - Linux arm64

on:
  schedule:
    # Weekday mornings at 09:15 UTC = 01:15 PST (UTC - 8).
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
  workflow_call:


jobs:
  linux_arm64_clang:
    if: ${{ github.repository_owner == 'iree-org' }}
    # See https://gitlab.arm.com/tooling/gha-runner-docs
    runs-on: ah-ubuntu_22_04-c7g_4x-50
    container:
      image: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:f3e2c56680b6007f29c8e191d93dfcb4f8800802e3caeb4851da90f2a1a0b5a5
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build-arm64
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install Python requirements
        run: |
          python3 -m pip install -r ./runtime/bindings/python/iree/runtime/build_requirements.txt
          python3 -m pip install -r ./build_tools/github_actions/ci_requirements.txt
      # TODO(#18557): enable sccache (watching for network bandwidth charges
      #               between the cache server and AWS VMs)
      - name: CMake - configure
        run: |
          cmake \
            -G Ninja \
            -B ${BUILD_DIR} \
            -DPython3_EXECUTABLE="$(which python3)" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DIREE_BUILD_PYTHON_BINDINGS=ON \
            -DIREE_ENABLE_LLD=ON \
            -DIREE_ENABLE_ASSERTIONS=ON \
            -DIREE_ENABLE_SPLIT_DWARF=ON \
            -DIREE_ENABLE_THIN_ARCHIVES=ON \
            -DIREE_BUILD_DOCS=ON \
            -DIREE_TARGET_BACKEND_WEBGPU_SPIRV=ON
      - name: CMake - build
        run: |
          cmake --build ${BUILD_DIR} -- -k 0
          cmake --build ${BUILD_DIR} --target install -- -k 0
          cmake --build ${BUILD_DIR} --target iree-test-deps -- -k 0
      - name: Run CTest
        env:
          # (For now) QEMU is required to run tests with SME
          IREE_ARM_SME_QEMU_AARCH64_BIN: /usr/bin/qemu-aarch64
        run: ./build_tools/cmake/ctest_all.sh "${BUILD_DIR}"

      - name: Post to Discord on Failure
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        if: failure() && github.ref_name == 'main' && github.repository_owner == 'iree-org'
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          description: "The ${{ github.workflow }} workflow failed"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"

  runtime_resources:
    if: github.repository == '1sgtpepper/iree'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build-runtime
      CC: clang
      CXX: clang++
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install native runtime requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          bash ./build_tools/scripts/git/update_runtime_submodules.sh
          pip install -r ./runtime/bindings/python/iree/runtime/build_requirements.txt
          mkdir -p runtime-evidence
          git rev-parse HEAD HEAD^{tree} > runtime-evidence/source-identity.log
      - name: Restore native runtime cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: runtime-ubuntu-24.04-arm
      - name: Build the original test binary
        run: |
          cmake -G Ninja -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DIREE_BUILD_COMPILER=OFF \
            -DIREE_BUILD_PYTHON_BINDINGS=ON \
            -DIREE_BUILD_SAMPLES=ON \
            -DIREE_ENABLE_LLD=ON \
            -DIREE_ENABLE_ASSERTIONS=ON \
            -DIREE_HAL_DRIVER_CUDA=ON \
            -DIREE_HAL_DRIVER_HIP=ON \
            -DIREE_HAL_DRIVER_VULKAN=ON \
            2>&1 | tee runtime-evidence/configure.log
          cmake --build "${BUILD_DIR}" --target iree_async_platform_io_uring_cts_buffer_tests \
            2>&1 | tee runtime-evidence/build.log
      - name: Require the previously failing case to execute
        run: |
          {
            uname -a
            getconf PAGESIZE
            ulimit -l
          } > runtime-evidence/environment.log
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l >> runtime-evidence/environment.log
          runtime_case='CTS/SharedBufferPoolTest.OpenValidatesBufferSizeMismatch/io_uring_no_futex'
          "${BUILD_DIR}/runtime/src/iree/async/platform/io_uring/cts/buffer_tests" \
            --gtest_color=no --gtest_filter="${runtime_case}" \
            2>&1 | tee runtime-evidence/original-case.log
          grep -F "[ RUN      ] ${runtime_case}" runtime-evidence/original-case.log
          grep -F "[       OK ] ${runtime_case}" runtime-evidence/original-case.log
          grep -F '[  PASSED  ] 1 test.' runtime-evidence/original-case.log
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-runtime-resource-evidence
          path: runtime-evidence
          if-no-files-found: error
