name: CI - Linux x64 bazel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux_x64_bazel:
    runs-on: ${{ github.repository_owner == 'iree-org' && 'azure-linux-scale' || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:78a558b999b230f7e1da376639e14b44f095f30f1777d6a272ba48c0bbdd4ccb
      env:
        SANDBOX_BASE: /tmp/bazel-sandbox
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install Python requirements
        run: python3 -m pip install -r ./runtime/bindings/python/iree/runtime/build_requirements.txt
      - name: Restore Bazel action cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bazel-cache
          key: bazel8.6-clang-llvm53e39b225bd1-${{ github.sha }}
          restore-keys: |
            bazel8.6-clang-llvm53e39b225bd1-
      - name: Build and test with Bazel
        env:
          IREE_CUDA_DEPS_DIR: /usr/local/iree_cuda_deps
        run: |
          ./build_tools/bazel/install_bazelisk.sh 1.21.0
          cp ./build_tools/scripts/fetch_cuda_deps.sh /usr/local/bin
          /usr/local/bin/fetch_cuda_deps.sh ${IREE_CUDA_DEPS_DIR}
          cat >> build_tools/bazel/iree.bazelrc << EOF
          build --jobs=4
          build --local_resources=memory=8192
          build --disk_cache=${GITHUB_WORKSPACE}/.bazel-cache
          build --experimental_disk_cache_gc_max_size=4G
          build --experimental_disk_cache_gc_idle_delay=1s
          EOF
          mkdir -p "${SANDBOX_BASE}"
          nproc
          free -h
          # Stop build workers and the cache GC daemon before the snapshot.
          setsid timeout --signal=TERM --kill-after=30s 320m ./build_tools/bazel/build_test_all.sh &
          build_pid=$!
          build_status=0
          wait "$build_pid" || build_status=$?
          if kill -0 -- "-$build_pid" 2>/dev/null; then
            kill -KILL -- "-$build_pid"
          fi
          bazel --noworkspace_rc --bazelrc=build_tools/bazel/iree.bazelrc shutdown
          exit "$build_status"

      - name: Save Bazel action cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bazel-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Alerting on failure is the responsibility of the calling job.
