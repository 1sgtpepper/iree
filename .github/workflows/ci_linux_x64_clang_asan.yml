name: CI - Linux x64 clang ASan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux_x64_clang_asan:
    runs-on: ${{ github.repository_owner == 'iree-org' && 'azure-linux-scale' || 'ubuntu-24.04' }}
    container: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:78a558b999b230f7e1da376639e14b44f095f30f1777d6a272ba48c0bbdd4ccb
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 2
      IREE_READ_LOCAL_CCACHE: 1
      IREE_WRITE_LOCAL_CCACHE: 1
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Restore local compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-llvm53e39b225bd1
          max-size: 5G

      - name: Install Python requirements
        run: |
          python3 -m pip install -r ./runtime/bindings/python/iree/runtime/build_requirements.txt
          python3 -m pip install -r ./build_tools/github_actions/ci_requirements.txt
      - name: Build and test with ASan
        env:
          # Use a modern clang explicitly.
          CC: clang-19
          CXX: clang++-19
          SCCACHE_AZURE_CONNECTION_STRING: "${{ secrets.AZURE_CCACHE_CONNECTION_STRING }}"
          SCCACHE_AZURE_BLOB_CONTAINER: ccache-container
          SCCACHE_CACHE_ZSTD_LEVEL: 10
          SCCACHE_AZURE_KEY_PREFIX: "ci_linux_x64_clang_asan"
        run: |
          source build_tools/cmake/setup_sccache.sh
          if (( IREE_USE_SCCACHE == 0 )); then
            source build_tools/cmake/setup_ccache.sh
          fi
          nproc
          free -h
          # Leave time to save the cache after stopping this build's writers.
          setsid timeout --signal=TERM --kill-after=30s 320m ./build_tools/cmake/build_and_test_asan.sh &
          build_pid=$!
          build_status=0
          wait "$build_pid" || build_status=$?
          if kill -0 -- "-$build_pid" 2>/dev/null; then
            kill -KILL -- "-$build_pid"
          fi
          sccache --show-stats
          exit "$build_status"

      # Alerting on failure is the responsibility of the calling job.
