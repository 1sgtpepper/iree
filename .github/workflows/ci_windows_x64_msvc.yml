name: CI - Windows x64 MSVC

on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows_x64_msvc:
    runs-on: ${{ github.repository_owner == 'iree-org' && 'azure-windows-scale' || 'windows-2022' }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
      IREE_READ_LOCAL_CCACHE: 1
      IREE_WRITE_LOCAL_CCACHE: 1
      SCCACHE_AZURE_CONNECTION_STRING: "${{ secrets.AZURE_CCACHE_CONNECTION_STRING }}"
      SCCACHE_AZURE_BLOB_CONTAINER: ccache-container
      SCCACHE_CACHE_ZSTD_LEVEL: 10
      SCCACHE_AZURE_KEY_PREFIX: "ci_windows_x64_msvc"
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # TODO(#18813): Remove this. Environment setup needs to happen on runners, not in workflows.
      - name: "Create build dir"
        run: |
          $buildDir = "$env:RUNNER_TEMP\iree-build"
          $env:BUILD_DIR_POWERSHELL = $buildDir
          echo "BUILD_DIR_POWERSHELL=$buildDir" >> $env:GITHUB_ENV
          mkdir "$buildDir"
          Write-Host "Generated Build Directory: $buildDir"
          $bashBuildDir = bash -c 'cygpath -u "$BUILD_DIR_POWERSHELL"'
          echo  "BUILD_DIR_BASH=$bashBuildDir" >> $env:GITHUB_ENV
          Write-Host "Converted Build Directory For Bash: $bashBuildDir"
      - name: "Setting up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Installing Python packages"
        run: |
          python3 -m venv .venv
          .venv/Scripts/activate.bat
          python3 -m pip install -r runtime/bindings/python/iree/runtime/build_requirements.txt
      - name: Restore local compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-llvm53e39b225bd1
          max-size: 8G
      - name: "Configuring MSVC"
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Record initial memory commit limit
        if: github.repository == '1sgtpepper/iree'
        id: memory_before
        run: |
          $memory = Get-CimInstance Win32_PerfRawData_PerfOS_Memory
          $memory | Select-Object AvailableBytes, CommittedBytes, CommitLimit | ConvertTo-Json -Compress
          Get-PSDrive C, D | Select-Object Name, Used, Free | ConvertTo-Json -Compress
          if ([UInt64]$memory.CommitLimit -eq 0) { throw "Memory commit limit is unavailable" }
          "commit_limit=$($memory.CommitLimit)" >> $env:GITHUB_OUTPUT
      - name: Provision hosted virtual memory
        if: github.repository == '1sgtpepper/iree'
        uses: al-cheb/configure-pagefile-action@b158448acc98bbaeed7513afc5c84229405b33ad
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "D:"
      - name: Require increased runtime commit capacity
        if: github.repository == '1sgtpepper/iree'
        run: |
          $memory = Get-CimInstance Win32_PerfRawData_PerfOS_Memory
          $memory | Select-Object AvailableBytes, CommittedBytes, CommitLimit | ConvertTo-Json -Compress
          Get-CimInstance Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage | ConvertTo-Json -Compress
          Get-PSDrive C, D | Select-Object Name, Used, Free | ConvertTo-Json -Compress
          $before = [UInt64]'${{ steps.memory_before.outputs.commit_limit }}'
          if ($before -eq 0 -or [UInt64]$memory.CommitLimit -lt 31GB -or [UInt64]$memory.CommitLimit -le $before) {
            throw "Runtime commit capacity did not increase to at least 31 GiB"
          }
      - name: Record build resource limits
        run: |
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory
      - name: "Installing IREE requirements"
        run: |
          choco install sccache
          choco install cmake
          # ninja pinned due to a bug in the 1.13.0 release:
          # https://github.com/ninja-build/ninja/issues/2616
          choco install ninja --version 1.12.1 --allow-downgrade --yes
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv
      - name: "Building IREE"
        shell: bash
        run: |
          echo "Building in ${{ env.BUILD_DIR_BASH }}"
          source ./build_tools/cmake/setup_sccache.sh
          bash ./build_tools/cmake/build_all.sh ${{ env.BUILD_DIR_BASH }}
      - name: "Testing IREE"
        run: bash ./build_tools/cmake/ctest_all.sh ${{ env.BUILD_DIR_BASH }}
      - name: "Clean up build dir"
        if: always()
        run: if (Test-Path -Path "$Env:BUILD_DIR_POWERSHELL") {Remove-Item -Path "$Env:BUILD_DIR_POWERSHELL" -Recurse -Force}

      # Alerting on failure is the responsibility of the calling job.
