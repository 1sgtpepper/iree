name: Clang Tidy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  clang-tidy:
    if: github.repository == '1sgtpepper/iree'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:78a558b999b230f7e1da376639e14b44f095f30f1777d6a272ba48c0bbdd4ccb
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build
      TIDY_RESOURCE_DIR: ${{ github.workspace }}/build/llvm-project/lib/clang/24
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      IREE_READ_LOCAL_CCACHE: 1
      IREE_WRITE_LOCAL_CCACHE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 40
          persist-credentials: false

      - name: Download pinned clang-tidy
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          repo: iree-org/iree
          run_id: 32944069152
          name: iree-clang-tidy-linux-x86_64
          path: .iree-clang-tidy

      - name: Verify analysis tool and compiler source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p tidy-evidence
          test "$(cat .iree-clang-tidy/llvm-project-revision.txt)" = "$(git -C third_party/llvm-project rev-parse HEAD)"
          echo "97f912d92e251d09f7c7d721981991b909bdeab880a3378a3f8ee056b39bfc38  .iree-clang-tidy/clang-tidy" | sha256sum --check
          git diff --exit-code dfc43d927a032f46524252ee57f49b54b18740f3 -- compiler/src tests/e2e/regression
          chmod +x .iree-clang-tidy/clang-tidy
          .iree-clang-tidy/clang-tidy --version | tee tidy-evidence/tool-version.log
          git rev-parse HEAD HEAD^{tree} > tidy-evidence/source-identity.log

      - name: Restore local compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux_x64_clang-llvm53e39b225bd1
          max-size: 1G

      - name: Install Python requirements
        run: |
          python3 -m pip install -r ./runtime/bindings/python/iree/runtime/build_requirements.txt
          python3 -m pip install -r ./build_tools/github_actions/ci_requirements.txt

      - name: Prepare compilation database and generated headers
        run: |
          IREE_CONFIGURE_ONLY=1 ./build_tools/cmake/build_all.sh "${BUILD_DIR}" 2>&1 | tee tidy-evidence/configure.log
          ninja -C "${BUILD_DIR}" -j2 clang-resource-headers \
            compiler/src/iree/compiler/Dialect/LinalgExt/IR/CMakeFiles/iree_compiler_Dialect_LinalgExt_IR_IR.objects.dir/TilingInterfaceImpl.cpp.o \
            compiler/src/iree/compiler/DispatchCreation/CMakeFiles/iree_compiler_DispatchCreation_DispatchCreation.objects.dir/ConvertDispatchRegionsToWorkgroups.cpp.o \
            2>&1 | tee tidy-evidence/build.log

      - name: Verify analysis rejects an incorrect result
        run: |
          test -f "${TIDY_RESOURCE_DIR}/include/stddef.h"
          printf '#include <stddef.h>\nint validName() { return 0; }\n' > tidy-evidence/valid.cpp
          printf '#include <stddef.h>\nint InvalidName() { return 0; }\n' > tidy-evidence/invalid.cpp
          .iree-clang-tidy/clang-tidy --config-file=compiler/.clang-tidy \
            --extra-arg="-resource-dir=${TIDY_RESOURCE_DIR}" --warnings-as-errors='*' \
            tidy-evidence/valid.cpp -- -std=c++17 2>&1 | tee tidy-evidence/valid-control.log
          set +e
          .iree-clang-tidy/clang-tidy --config-file=compiler/.clang-tidy \
            --extra-arg="-resource-dir=${TIDY_RESOURCE_DIR}" --warnings-as-errors='*' \
            --line-filter='[{"name":"invalid.cpp","lines":[[2,2]]}]' \
            tidy-evidence/invalid.cpp -- -std=c++17 2>&1 | tee tidy-evidence/invalid-control.log
          tidy_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${tidy_pipeline_status[1]}" -eq 0
          test "${tidy_pipeline_status[0]}" -eq 1
          grep -F "invalid case style for function 'InvalidName'" tidy-evidence/invalid-control.log
          grep -F 'readability-identifier-naming,-warnings-as-errors' tidy-evidence/invalid-control.log
          printf '#include <stddef.h>\nint validName() { return missingValue; }\n' > tidy-evidence/compiler-error.cpp
          set +e
          .iree-clang-tidy/clang-tidy --config-file=compiler/.clang-tidy \
            --extra-arg="-resource-dir=${TIDY_RESOURCE_DIR}" --warnings-as-errors='*' \
            --line-filter='[{"name":"compiler-error.cpp","lines":[[1,1]]}]' \
            tidy-evidence/compiler-error.cpp -- -std=c++17 2>&1 | tee tidy-evidence/compiler-error-control.log
          tidy_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${tidy_pipeline_status[1]}" -eq 0
          test "${tidy_pipeline_status[0]}" -eq 1
          grep -F "use of undeclared identifier 'missingValue'" tidy-evidence/compiler-error-control.log

      - name: Select changed lines using the repository policy
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          files = [
              "compiler/src/iree/compiler/Dialect/LinalgExt/IR/TilingInterfaceImpl.cpp",
              "compiler/src/iree/compiler/DispatchCreation/ConvertDispatchRegionsToWorkgroups.cpp",
          ]
          line_filter = []
          for file in files:
              diff = subprocess.check_output([
                  "git", "diff", "--unified=0",
                  "6ec253ad4e259ad256c8a226f7a7a330debf937c", "HEAD", "--", file,
              ], text=True)
              ranges = []
              for line in diff.splitlines():
                  match = re.match(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", line)
                  if match:
                      start = int(match.group(1))
                      count = int(match.group(2)) if match.group(2) is not None else 1
                      if count:
                          ranges.append([start, start + count - 1])
              if not ranges:
                  raise SystemExit(f"Required changed lines are absent: {file}")
              line_filter.append({"name": str(Path(file).resolve()), "lines": ranges})
          Path("tidy-evidence/line-filter.json").write_text(json.dumps(line_filter))
          PY

      - name: Analyze both changed translation units
        run: |
          .iree-clang-tidy/clang-tidy -p "${BUILD_DIR}" --warnings-as-errors='*' \
            --extra-arg="-resource-dir=${TIDY_RESOURCE_DIR}" \
            --line-filter="$(cat tidy-evidence/line-filter.json)" \
            compiler/src/iree/compiler/Dialect/LinalgExt/IR/TilingInterfaceImpl.cpp \
            compiler/src/iree/compiler/DispatchCreation/ConvertDispatchRegionsToWorkgroups.cpp \
            2>&1 | tee tidy-evidence/analysis.log

      - name: Preserve analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sort-workspace-tidy-evidence
          path: tidy-evidence
          if-no-files-found: error
