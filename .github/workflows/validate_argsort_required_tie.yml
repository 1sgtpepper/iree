name: Validate argsort required tie

on:
  push:
    branches:
      - validation/argsort-required-tied-result

permissions:
  contents: read

concurrency:
  group: validate-argsort-required-tie
  cancel-in-progress: true

jobs:
  targeted_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:78a558b999b230f7e1da376639e14b44f095f30f1777d6a272ba48c0bbdd4ccb
      options: --mount type=tmpfs,destination=/dev/shm
      env:
        SANDBOX_BASE: /dev/shm
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ce122ace9ddc1bd65d43d071fff9f4bbda58db23
      BAZEL_DISK_CACHE: /tmp/iree-bazel-disk-cache
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
          persist-credentials: false
      - name: Verify source revision
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: argsort-required-tie-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            argsort-required-tie-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}-
      - name: Install Python requirements
        run: python3 -m pip install -r runtime/bindings/python/iree/runtime/build_requirements.txt
      - name: Install Bazelisk
        run: ./build_tools/bazel/install_bazelisk.sh 1.21.0
      - name: Build and run focused tests
        run: |
          bazel \
            --noworkspace_rc \
            --bazelrc=build_tools/bazel/iree.bazelrc \
            test \
            --sandbox_base="${SANDBOX_BASE}" \
            --disk_cache="${BAZEL_DISK_CACHE}" \
            --config=generic_clang_ci \
            --noremote_upload_local_results \
            --iree_compiler_plugins=hal_target_llvm_cpu,hal_target_local \
            --iree_drivers=local-task \
            --jobs=4 \
            --local_cpu_resources=4 \
            --test_output=errors \
            //compiler/src/iree/compiler/Dialect/LinalgExt/IR/test:canonicalize.mlir.test \
            //compiler/src/iree/compiler/Dialect/Flow/IR/test:dispatch_folding.mlir.test \
            //compiler/src/iree/compiler/DispatchCreation/test:dispatch_linalg_on_tensors.mlir.test \
            //compiler/src/iree/compiler/DispatchCreation/test:form_scalar_dispatches.mlir.test \
            //tests/e2e/regression:argsort_dynamic.mlir.test
