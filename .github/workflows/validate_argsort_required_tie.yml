name: Validate argsort required tie

on:
  push:
    branches:
      - validation/argsort-required-tied-result

permissions:
  contents: read

env:
  SOURCE_SHA: d40427e5506987a396c89229ed4d2a66593331a3

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Initialize compiler submodule
        run: git submodule update --init --depth=1 third_party/llvm-project
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - name: Run repository lint checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  targeted_tests:
    concurrency:
      group: validate-argsort-required-tie
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:78a558b999b230f7e1da376639e14b44f095f30f1777d6a272ba48c0bbdd4ccb
      options: --mount type=tmpfs,destination=/dev/shm
      env:
        SANDBOX_BASE: /dev/shm
    defaults:
      run:
        shell: bash
    env:
      BAZEL_DISK_CACHE: /tmp/iree-bazel-disk-cache
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
          persist-credentials: false
      - name: Verify source revision
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Restore Bazel disk cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: argsort-required-tie-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            argsort-required-tie-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}-
      - name: Install Python requirements
        run: python3 -m pip install -r runtime/bindings/python/iree/runtime/build_requirements.txt
      - name: Install Bazelisk
        run: ./build_tools/bazel/install_bazelisk.sh 1.21.0
      - name: Build and run focused tests
        run: |
          bazel \
            --noworkspace_rc \
            --bazelrc=build_tools/bazel/iree.bazelrc \
            test \
            --sandbox_base="${SANDBOX_BASE}" \
            --disk_cache="${BAZEL_DISK_CACHE}" \
            --config=generic_clang_ci \
            --noremote_upload_local_results \
            --iree_compiler_plugins=hal_target_llvm_cpu,hal_target_local \
            --iree_drivers=local-task \
            --jobs=4 \
            --local_cpu_resources=4 \
            --test_output=errors \
            //compiler/src/iree/compiler/Dialect/LinalgExt/IR/test:canonicalize.mlir.test \
            //compiler/src/iree/compiler/Dialect/Flow/IR/test:dispatch_folding.mlir.test \
            //compiler/src/iree/compiler/DispatchCreation/test:convert_region_to_workgroups.mlir.test \
            //compiler/src/iree/compiler/DispatchCreation/test:dispatch_linalg_on_tensors.mlir.test \
            //compiler/src/iree/compiler/DispatchCreation/test:form_scalar_dispatches.mlir.test \
            //tests/e2e/regression:argsort_dynamic.mlir.test
      - name: Save focused validation cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Confirm missing required ties fails
        run: |
          source_file=compiler/src/iree/compiler/ExternalInterfaces/UtilExternalModels.cpp
          trap 'git restore -- "$source_file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path("compiler/src/iree/compiler/ExternalInterfaces/UtilExternalModels.cpp")
          text = path.read_text()
          required = """      auto blockArgs = sortOp.getRegion().front().getArguments();
                return !blockArgs[2 * resultIndex].use_empty() ||
                       !blockArgs[2 * resultIndex + 1].use_empty();"""
          assert text.count(required) == 1
          path.write_text(text.replace(required, "      return false;"))
          PY
          set +e
          bazel \
            --noworkspace_rc \
            --bazelrc=build_tools/bazel/iree.bazelrc \
            test \
            --sandbox_base="${SANDBOX_BASE}" \
            --disk_cache="${BAZEL_DISK_CACHE}" \
            --config=generic_clang_ci \
            --noremote_upload_local_results \
            --iree_compiler_plugins=hal_target_llvm_cpu,hal_target_local \
            --iree_drivers=local-task \
            --jobs=4 \
            --local_cpu_resources=4 \
            --test_output=errors \
            //tests/e2e/regression:argsort_dynamic.mlir.test \
            > /tmp/argsort-without-required-ties.log 2>&1
          status=$?
          set -e
          cat /tmp/argsort-without-required-ties.log
          test "$status" -ne 0
          grep -F 'expected no unbounded stack allocations' /tmp/argsort-without-required-ties.log
