name: Validate argsort pipeline

on:
  push:
    branches:
      - validation/argsort-review

permissions:
  actions: read
  contents: read

env:
  SOURCE_SHA: c059af93cf68af6df458df22a11f0fdc2576f9f3

jobs:
  normal_pipeline:
    concurrency:
      group: validate-argsort-pipeline
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:78a558b999b230f7e1da376639e14b44f095f30f1777d6a272ba48c0bbdd4ccb
      options: --mount type=tmpfs,destination=/dev/shm
      env:
        SANDBOX_BASE: /dev/shm
    defaults:
      run:
        shell: bash
    env:
      BAZEL_DISK_CACHE: /tmp/iree-bazel-disk-cache
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: true
          persist-credentials: false
      - name: Verify source revision
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Restore Bazel disk cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: argsort-required-tie-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            argsort-required-tie-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}-
      - name: Require the existing compiler cache
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: test "${CACHE_HIT}" = true
      - name: Install Bazelisk
        run: ./build_tools/bazel/install_bazelisk.sh 1.21.0
      - name: Restore cached compiler tools
        run: |
          bazel --noworkspace_rc --bazelrc=build_tools/bazel/iree.bazelrc build \
            --sandbox_base="${SANDBOX_BASE}" \
            --disk_cache="${BAZEL_DISK_CACHE}" \
            --config=generic_clang_ci --noremote_upload_local_results \
            --iree_compiler_plugins=hal_target_llvm_cpu,hal_target_local \
            --iree_drivers=local-task --jobs=4 --local_cpu_resources=4 \
            //tools:iree-opt @llvm-project//llvm:FileCheck
      - name: Check unused Sorts in the normal pipeline
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git show "${GITHUB_SHA}:review-validation/normal-pipeline-liveness.mlir" > "${RUNNER_TEMP}/normal-pipeline-liveness.mlir"
          bazel-bin/tools/iree-opt "${RUNNER_TEMP}/normal-pipeline-liveness.mlir" \
            --split-input-file --mlir-disable-threading \
            --iree-dispatch-creation-pipeline \
            > "${RUNNER_TEMP}/normal-pipeline.mlir"
          bazel --noworkspace_rc --bazelrc=build_tools/bazel/iree.bazelrc run \
            --sandbox_base="${SANDBOX_BASE}" \
            --disk_cache="${BAZEL_DISK_CACHE}" \
            --config=generic_clang_ci --noremote_upload_local_results \
            --iree_compiler_plugins=hal_target_llvm_cpu,hal_target_local \
            --iree_drivers=local-task --jobs=4 --local_cpu_resources=4 \
            @llvm-project//llvm:FileCheck -- \
            "${RUNNER_TEMP}/normal-pipeline-liveness.mlir" \
            < "${RUNNER_TEMP}/normal-pipeline.mlir"
          git diff --exit-code
      - name: Save normal pipeline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: normal-pipeline-evidence
          path: |
            ${{ runner.temp }}/normal-pipeline-liveness.mlir
            ${{ runner.temp }}/normal-pipeline.mlir
          if-no-files-found: warn
