name: Validate ARM64 runtime resources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    if: github.repository == '1sgtpepper/iree'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build-runtime
      CC: clang
      CXX: clang++
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install native runtime requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          bash ./build_tools/scripts/git/update_runtime_submodules.sh
          pip install -r ./runtime/bindings/python/iree/runtime/build_requirements.txt
          mkdir -p runtime-evidence
          git rev-parse HEAD HEAD^{tree} > runtime-evidence/source-identity.log
      - name: Restore native runtime cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: runtime-ubuntu-24.04-arm
      - name: Build the original test binary
        run: |
          cmake -G Ninja -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DIREE_BUILD_COMPILER=OFF \
            -DIREE_BUILD_PYTHON_BINDINGS=ON \
            -DIREE_BUILD_SAMPLES=ON \
            -DIREE_ENABLE_LLD=ON \
            -DIREE_ENABLE_ASSERTIONS=ON \
            -DIREE_HAL_DRIVER_CUDA=ON \
            -DIREE_HAL_DRIVER_HIP=ON \
            -DIREE_HAL_DRIVER_VULKAN=ON \
            2>&1 | tee runtime-evidence/configure.log
          cmake --build "${BUILD_DIR}" --target iree_async_platform_io_uring_cts_buffer_tests \
            2>&1 | tee runtime-evidence/build.log
      - name: Require the previously failing case to execute
        run: |
          {
            uname -a
            getconf PAGESIZE
            ulimit -l
          } > runtime-evidence/environment.log
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l >> runtime-evidence/environment.log
          runtime_case='CTS/SharedBufferPoolTest.OpenValidatesBufferSizeMismatch/io_uring_no_futex'
          "${BUILD_DIR}/runtime/src/iree/async/platform/io_uring/cts/buffer_tests" \
            --gtest_color=no --gtest_filter="${runtime_case}" \
            2>&1 | tee runtime-evidence/original-case.log
          grep -F "[ RUN      ] ${runtime_case}" runtime-evidence/original-case.log
          grep -F "[       OK ] ${runtime_case}" runtime-evidence/original-case.log
          grep -F '[  PASSED  ] 1 test.' runtime-evidence/original-case.log
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-runtime-resource-evidence
          path: runtime-evidence
          if-no-files-found: error
